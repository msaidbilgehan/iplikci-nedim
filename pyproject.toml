[project]
name = "iplikci-nedim"
version = "0.2.0"
description = "İplikçi Nedim (Money-Grubber): banka belgelerini toplayan, doğrulayan ve yorumlayan kişisel finans asistanı"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "keyring==25.7.0",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.10",
    "pyobjc-framework-vision==13.0 ; sys_platform == 'darwin'",
    "pyyaml==6.0.3",
    "xlrd==2.0.2",
]

[project.scripts]
iplikci = "iplikci.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "iplikci"

[dependency-groups]
dev = [
    "hypothesis==6.170.14",
    "pre-commit==4.7.0",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
# The design docs keep their hand-aligned code samples.
extend-exclude = ["docs"]

[tool.ruff.lint.isort]
# Test helpers come last, after the package, as their own group.
known-local-folder = ["conftest"]

[tool.pyright]
pythonVersion = "3.13"
# The modules written for V1 are checked strictly; the MVP's flat modules join as they move into the target
# layout (architecture §6).
include = ["src/iplikci/app", "src/iplikci/domain", "src/iplikci/settings", "src/iplikci/storage", "src/iplikci/vault"]
strict = ["src/iplikci/app", "src/iplikci/domain", "src/iplikci/settings", "src/iplikci/storage", "src/iplikci/vault"]
# An ignore comment that hides nothing is noise, like an unused import.
reportUnnecessaryTypeIgnoreComment = "error"
