[project]
name = "iplikci-nedim"
version = "1.0.14"
description = "İplikçi Nedim (Money-Grubber): banka belgelerini toplayan, doğrulayan ve yorumlayan kişisel finans asistanı"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "keyring==25.7.0",
    "mcp==2.3.0",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.10",
    "pillow==13.0.0",
    "pydantic==2.14.2",
    "pyobjc-framework-vision==13.0 ; sys_platform == 'darwin'",
    "pypdfium2==5.14.0",
    "pyyaml==6.0.3",
    "tomlkit==0.15.2",
    "uvicorn==0.54.0",
    "xlrd==2.0.2",
]

[project.scripts]
iplikci = "iplikci.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "iplikci"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "hypothesis==6.170.14",
    "pre-commit==4.7.0",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
# The design docs keep their hand-aligned code samples.
extend-exclude = ["docs"]

[tool.ruff.lint.isort]
# Test helpers come last, after the package, as their own group.
known-local-folder = ["conftest"]

[tool.pyright]
pythonVersion = "3.13"
# The modules written for V1 are checked strictly; the MVP's flat modules join as they move into the target
# layout (architecture §6).
include = [
    "src/iplikci/api",
    "src/iplikci/egress.py",
    "src/iplikci/app",
    "src/iplikci/domain",
    "src/iplikci/fakes",
    "src/iplikci/exchange.py",
    "src/iplikci/feed",
    "src/iplikci/forecast.py",
    "src/iplikci/fx",
    "src/iplikci/inflation.py",
    "src/iplikci/ingest",
    "src/iplikci/invoices.py",
    "src/iplikci/jobs",
    "src/iplikci/mcp",
    "src/iplikci/notify",
    "src/iplikci/parsers/accounts.py",
    "src/iplikci/parsers/contract.py",
    "src/iplikci/parsers/garanti/notice",
    "src/iplikci/parsers/invoice",
    "src/iplikci/parsers/isbank/notice",
    "src/iplikci/parsers/mail.py",
    "src/iplikci/parsers/messages.py",
    "src/iplikci/parsers/qnb/notice",
    "src/iplikci/parsers/registry.py",
    "src/iplikci/parsers/tools.py",
    "src/iplikci/parsers/vakifbank/notice",
    "src/iplikci/parsers/wire.py",
    "src/iplikci/parsers/worker.py",
    "src/iplikci/service",
    "src/iplikci/settings",
    "src/iplikci/storage",
    "src/iplikci/sync",
    "src/iplikci/upcoming.py",
    "src/iplikci/update",
    "src/iplikci/vault",
    "src/iplikci/versions.py",
    "src/iplikci/viewer",
]
strict = [
    "src/iplikci/api",
    "src/iplikci/egress.py",
    "src/iplikci/app",
    "src/iplikci/domain",
    "src/iplikci/fakes",
    "src/iplikci/exchange.py",
    "src/iplikci/feed",
    "src/iplikci/forecast.py",
    "src/iplikci/fx",
    "src/iplikci/inflation.py",
    "src/iplikci/ingest",
    "src/iplikci/invoices.py",
    "src/iplikci/jobs",
    "src/iplikci/mcp",
    "src/iplikci/notify",
    "src/iplikci/parsers/accounts.py",
    "src/iplikci/parsers/contract.py",
    "src/iplikci/parsers/garanti/notice",
    "src/iplikci/parsers/invoice",
    "src/iplikci/parsers/isbank/notice",
    "src/iplikci/parsers/mail.py",
    "src/iplikci/parsers/messages.py",
    "src/iplikci/parsers/qnb/notice",
    "src/iplikci/parsers/registry.py",
    "src/iplikci/parsers/tools.py",
    "src/iplikci/parsers/vakifbank/notice",
    "src/iplikci/parsers/wire.py",
    "src/iplikci/parsers/worker.py",
    "src/iplikci/service",
    "src/iplikci/settings",
    "src/iplikci/storage",
    "src/iplikci/upcoming.py",
    "src/iplikci/update",
    "src/iplikci/vault",
    "src/iplikci/versions.py",
    "src/iplikci/viewer",
]
# An ignore comment that hides nothing is noise, like an unused import.
reportUnnecessaryTypeIgnoreComment = "error"
