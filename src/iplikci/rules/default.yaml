# Uygulamayla gelen varsayılan kategori kuralları: Türkiye'de yaygın işyerleri, kurumlar ve anahtar kelimeler.
# Kişiye özgü kararlar (kira ve aidat alıcıları, aile ve kişiler, gelir kaynakları, biten ödemeler, bir işyerinin
# gerekliliği) bu dosyaya değil, kendi kural dosyanıza yazılır.
#
# Yapı:   Ana grup → Kategori → İşletme / kişi adı → [desenler]
#
#  • Desenler büyük/küçük harf ve Türkçe karakter duyarsızdır: "MİGROS" = "Migros" = "MIGROS".
#  • Desen, açıklamada bir kelimenin başından itibaren aranır:
#      "BIM" → "BIM A.S." ile eşleşir, "EBIM" ile eşleşmez.
#  • "re:" ile başlayan desen düzenli ifadedir; büyük harfe ve ASCII'ye çevrilmiş açıklamaya uygulanır
#    (ör. "MİGROS Şube" → "MIGROS SUBE").
#  • İşletme adı yerine "_" yazılırsa genel anahtar kelimedir; işletme adı açıklamadan alınır.
#    "_zayıf" en zayıf kelimelerdir; yalnızca başka hiçbir kural tutmazsa denenir.
#  • Önce isimli kurallar (dosyadaki sırayla), sonra genel kelimeler denenir. Genel kelimelerde
#    açıklamada en önce geçen kelime kazanır ("ÖRNEK PETROL MARKET" → PETROL → Akaryakıt).
#  • Bir kategoriye "_hariç" yazılırsa, desenlerinin başladığı ama o kategoriye ait olmayan kelimeler
#    sayılır: o kelimenin yerindeki eşleşme yok sayılır, açıklamada daha sonra geçen eşleşme yine sayılır
#      Kira: _: [KIRA], _hariç: [KIRAATHANE] → "ÖRNEK KIRAATHANESİ" kira değildir.
#    Kişisel dosyanızdaki "_hariç", uygulamayla gelenin üstüne eklenir.
#  • Hesap hareketlerindeki havale/FAST satırlarında açıklamanın yanında alıcı/gönderen adı da aranır.
#  • Bir kategoriye "_tür" yazılırsa o kategorideki para hareketinin türü değişir:
#      gelir   → gelen para gelir sayılır (maaş)
#      kişi    → giden para "kişilere gönderilen", gelen para gelir sayılır (aile, arkadaş)
#      borç    → borç anaparası ödemesi / alınan borç
#      yatırım → birikim (BES, sermaye); gider sayılmaz
#  • Ana grupların sırası grafiklerdeki renkleri belirler. İlk 8 grup renklidir, sonrakiler gridir.
#  • Faiz/ücret, kredi kartı ödemesi, nakit avans, kendi hesaplarınız arası transferler ve yatırım
#    hesabı ekstrelerindeki hisse senedi alım-satımları işlem türüne göre otomatik olarak
#    "Banka & Finans" grubuna yazılır.

